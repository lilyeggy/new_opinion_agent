name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e 'opinion_search_agent[dev]'

      - name: Run Ruff Lint
        run: |
          ruff check opinion_search_agent/src opinion_search_agent/tests --config opinion_search_agent/pyproject.toml

      - name: Run Mypy Typecheck
        run: |
          mypy opinion_search_agent/src/opinion_search/runtime --ignore-missing-imports

      - name: Run Unit Tests
        run: |
          pytest opinion_search_agent/tests/unit -q

      - name: Run Contract, Integration & Security Tests
        run: |
          pytest opinion_search_agent/tests/contract opinion_search_agent/tests/integration opinion_search_agent/tests/security -q

      - name: Verify Frozen Report-Quality Baseline
        run: |
          python opinion_search_agent/scripts/quality_gate.py --check

      - name: Run Closeout & Quality Gate Tests
        run: |
          pytest opinion_search_agent/tests/quality -q
